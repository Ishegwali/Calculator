<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Conversion Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <h1>Currency Dashboard</h1>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Loading rates...</span>
      </div>
    </header>

    <section class="card converter">
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" min="0" step="any" value="1" inputmode="decimal">
      </div>

      <div class="currencies">
        <div class="field">
          <label for="from">From</label>
          <select id="from"></select>
        </div>

        <button id="swap" class="swap" title="Swap currencies" aria-label="Swap currencies">&#8644;</button>

        <div class="field">
          <label for="to">To</label>
          <select id="to"></select>
        </div>
      </div>

      <div class="result">
        <div id="result-value" class="result-value">—</div>
        <div id="result-rate" class="result-rate"></div>
      </div>

      <div class="actions">
        <button id="refresh" class="btn">Refresh rates</button>
        <label class="pin-label">
          <input type="checkbox" id="pin"> Pin this pair
        </label>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Pinned pairs</h2>
        <button id="clear-pins" class="link-btn">Clear</button>
      </div>
      <ul id="pinned-list" class="list"></ul>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Conversion history</h2>
        <button id="clear-history" class="link-btn">Clear</button>
      </div>
      <ul id="history-list" class="list"></ul>
    </section>

    <footer class="footer" id="footer-info"></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
